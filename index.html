<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Hover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #f5f2ed;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            max-width: 1000px;
        }

        .tile {
            position: relative;
            aspect-ratio: 494 / 557;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.08);
        }

        .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            object-position: top;
        }

        .tile .frame {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .ink {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.5);
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ink svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tile:nth-child(1) .ink-a path { stroke: #c9a55a; }
        .tile:nth-child(1) .ink-b path { stroke: #f4f0e8; }
        .tile:nth-child(2) .ink-a path { stroke: #6b9bc4; }
        .tile:nth-child(2) .ink-b path { stroke: #f0eef4; }
        .tile:nth-child(3) .ink-a path { stroke: #c4865a; }
        .tile:nth-child(3) .ink-b path { stroke: #f2efe8; }
        .tile:nth-child(4) .ink-a path { stroke: #c9a84a; }
        .tile:nth-child(4) .ink-b path { stroke: #f4f2ea; }
        .tile:nth-child(5) .ink-a path { stroke: #5a9070; }
        .tile:nth-child(5) .ink-b path { stroke: #f0f2ee; }
        .tile:nth-child(6) .ink-a path { stroke: #d4946a; }
        .tile:nth-child(6) .ink-b path { stroke: #f2ebe4; }

        .label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.25rem;
            color: #1a1a1a;
            opacity: 0;
            pointer-events: none;
            z-index: 2;
        }
        .label-title {
            font-size: 1.125rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .label-sub {
            font-size: 0.8125rem;
            font-weight: 400;
            color: rgba(26, 26, 26, 0.7);
        }
    </style>
</head>

    <script>
        document.querySelectorAll('.tile').forEach(t => {
            const paths = [...t.querySelectorAll('.path')];
            const lbl = t.querySelector('.label');
            const lens = paths.map(p => {
                const len = p.getTotalLength();
                p.style.strokeDasharray = len;
                p.style.strokeDashoffset = len;
                return len;
            });

            t.onmouseenter = () => {
                gsap.killTweensOf([...paths, lbl]);
                gsap.to(paths, { strokeDashoffset: 0, attr: { 'stroke-width': 700 }, duration: 1.5, ease: 'power2.out' });
                gsap.to(lbl, { opacity: 1, duration: 0.5, delay: 0.4, ease: 'power2.out' });
            };
            t.onmouseleave = () => {
                gsap.killTweensOf([...paths, lbl]);
                gsap.to(paths, { strokeDashoffset: (i) => lens[i], attr: { 'stroke-width': 100 }, duration: 1, ease: 'power2.out' });
                gsap.to(lbl, { opacity: 0, duration: 0.3 });
            };
        });
    </script>
